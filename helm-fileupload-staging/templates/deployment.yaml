apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileupload
  labels:
    app: fileupload
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: fileupload
  template:
    metadata:
      labels:
        app: fileupload
    spec:
      containers:
        - name: fileupload
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: "s3-service"
            - name: ENVIRONMENT
              value: "local"
            - name: RSYSLOG_DESTINATIONS
              value: "localhost:514"
            - name: REDIS_NODES
              value: "192.168.122.88:6379"
            - name: REDIS_USERNAME
              value: ""
            - name: REDIS_PASSWORD
              value: ""
            - name: REDIS_SSL
              value: "false"
            - name: MONGO_HOST
              value: "192.168.122.88"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USERNAME
              value: "admin"
            - name: MONGO_PASSWORD
              value: "admin123"
            - name: MONGO_AUTH_DB
              value: "admin"
            - name: MONGO_DB_NAME
              value: "ora_test"
            - name: MONGO_AUDIT_COLLECTION
              value: "s3_audit_logs"
            - name: S3_ENDPOINT_URL
              value: "http://192.168.122.88:9000"
            - name: S3_ACCESS_KEY
              value: "minioadmin"
            - name: S3_SECRET_KEY
              value: "minioadmin"
            - name: S3_REGION
              value: "us-east-1"
            - name: S3_SECURE
              value: "false"
            - name: S3_ADDRESSING_STYLE
              value: "path"
            - name: USER_BUCKET
              value: "uploads"
            - name: RECRUITMENT_BUCKET
              value: "recruitment"
          ports:
            - containerPort: 9002
              protocol: TCP

